[workspace]
members = [
    "crates/greentic-component",
    "crates/component-manifest",
    "crates/greentic-component-store",
    "crates/greentic-component-runtime",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.6.0-dev.0"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
assert_fs = "1"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
bytes = "1"
ciborium = "0.2"
criterion = "0.8"
dashmap = "6"
directories = "6"
displaydoc = "0.2"
futures = "0.3"
greentic-interfaces-host = ">=0.6.0-dev, <0.7.0-0"
greentic-interfaces-wasmtime = ">=0.6.0-dev, <0.7.0-0"
greentic-types = ">=0.6.0-dev, <0.7.0-0"
greentic-qa-lib = ">=0.6.0-dev, <0.7.0-0"
handlebars = "6"
hex = "0.4"
ignore = "0.4"
jsonschema = "0.46"
once_cell = "1"
pathdiff = "0.2"
percent-encoding = "2"
predicates = "3"
proptest = "1"
regex = "1"
schemars = "1"
serde_json = "1"
serde_with = "3"
sha2 = "0.11"
sys-locale = "0.3"
tempfile = "3"
thiserror = "2"
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
unic-langid = "0.9"
url = "2"
walkdir = "2"
wasm-encoder = "0"
wasm-metadata = "0"
wasmparser = "0"
wit-component = "0.247"
wit-parser = "0.247"

[workspace.dependencies.clap]
version = "4"
features = [
    "derive",
]

[workspace.dependencies.greentic-component-manifest]
version = ">=0.6.0-dev, <0.7.0-0"
path = "crates/component-manifest"

[workspace.dependencies.greentic-component-store]
version = ">=0.6.0-dev, <0.7.0-0"
path = "crates/greentic-component-store"

[workspace.dependencies.greentic-interfaces-guest]
version = ">=0.6.0-dev, <0.7.0-0"
default-features = false
features = [
    "component-v0-6",
]

[workspace.dependencies.greentic-interfaces]
version = ">=0.6.0-dev, <0.7.0-0"
default-features = false
features = [
    "bindings-rust",
    "common-types-v0-1",
    "component-v1",
    "component-v0-6",
    "describe-v1",
    "provision-v0-1",
    "wasix-mcp-v0-0-5",
    "wasix-mcp-24-11-05",
    "wasix-mcp-25-03-26",
    "wasix-mcp-25-06-18",
    "secrets-store-v1",
    "state-store-v1",
    "source-v1",
    "build-v1",
    "scan-v1",
    "signing-v1",
    "attestation-v1",
    "policy-v1",
    "metadata-v1",
    "distributor-api",
    "distributor-api-v1-1",
    "distribution-v1",
    "oci-v1",
    "http-client-v1",
    "http-client-v1-1",
    "telemetry-logger-v1",
    "repo-ui-actions-v1",
    "worker-api",
    "provider-common",
    "provider-core-v1",
    "oauth-broker-v1",
    "gui-fragment",
    "runner-host-v1",
]

[workspace.dependencies.greentic-distributor-client]
version = ">=0.6.0-dev, <0.7.0-0"
default-features = false
features = [
    "dist-client",
]

[workspace.dependencies.include_dir]
version = "0.7"

[workspace.dependencies.insta]
version = "1"
features = [
    "glob",
    "json",
]

[workspace.dependencies.miette]
version = "7"
default-features = false
features = [
    "derive",
]

[workspace.dependencies.oci-distribution]
version = "0.11"
default-features = false
features = [
    "rustls-tls",
]

[workspace.dependencies.reqwest]
version = "0.13"
default-features = false
features = [
    "json",
    "rustls",
    "blocking",
]

[workspace.dependencies.semver]
version = "1"
features = [
    "serde",
]

[workspace.dependencies.serde]
version = "1"
features = [
    "derive",
]

[workspace.dependencies.time]
version = "0.3"
features = [
    "serde",
    "formatting",
    "parsing",
]

[workspace.dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "fs",
    "time",
    "io-util",
]

[workspace.dependencies.uuid]
version = "1"
features = [
    "v4",
]

[workspace.dependencies.wasmtime]
version = "43"
default-features = false
features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
]

[workspace.dependencies.wasmtime-wasi]
version = "43"
