[workspace]
members = [
    "crates/greentic-component",
    "crates/component-manifest",
    "crates/greentic-component-store",
    "crates/greentic-component-runtime",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "1.2.0-dev.0"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
assert_fs = "1"
async-trait = "0.1"
base64 = "0.23"
blake3 = "1"
bytes = "1"
ciborium = "0.2"
criterion = "0.8"
dashmap = "6"
directories = "6"
displaydoc = "0.2"
futures = "0.3"
greentic-interfaces-host = ">=1.2.0-dev.37221142016, <1.3.0-0"
greentic-interfaces-wasmtime = ">=1.2.0-dev.37221142016, <1.3.0-0"
greentic-types = ">=1.2.0-dev, <1.3.0-0"
greentic-qa-lib = ">=1.2.0-dev, <1.3.0-0"
handlebars = "6"
hex = "0.4"
ignore = "0.4"
jsonschema = "0.49"
once_cell = "1"
pathdiff = "0.2"
percent-encoding = "2"
predicates = "3"
proptest = "1"
regex = "1"
schemars = "1"
serde_json = "1"
serde_with = "3"
sha2 = "0.11"
sys-locale = "0.3"
tempfile = "3"
thiserror = "2"
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
unic-langid = "0.9"
url = "2"
walkdir = "2"
# The wasm-tools family, all five held to ONE line.
#
# 0.256 is required, not preferred: `abi.rs` reads `export.name.name`, the named
# field that replaced the `ComponentExternName.0` tuple in 0.251. Lowering any of
# the three below is refused by the compiler, measured on this tree:
#   error[E0609]: no field `name` on type `ComponentExportName<'_>`
#   note: available field is: `0`
# The comment that used to sit here described exactly the opposite pin (0.248 /
# 0.247), because a90dfb4 moved the field access and the versions together and
# left the note behind.
#
# `wasm-encoder` and `wasm-metadata` were a bare "0", and that is the part this
# change fixes: an unbounded 0.x requirement resolves to whatever a consumer's
# lock already holds, so this crate straddled two lines at once. Measured in
# greentic-designer's lock, this crate alone named wasm-encoder 0.253 +
# wasm-metadata 0.253 BESIDE wasmparser / wit-component / wit-parser 0.256 — and
# wasmparser 0.253 was in that graph for no other reason than the 0.253
# wasm-metadata this edge pulled. Naming the line drops those three crates from
# every consumer's build.
wasm-encoder = "0.256"
wasm-metadata = "0.256"
wasmparser = "0.256"
wit-component = "0.256"
wit-parser = "0.256"

[workspace.dependencies.clap]
version = "4"
features = [
    "derive",
]

[workspace.dependencies.greentic-component-manifest]
version = ">=1.2.0-dev, <1.3.0-0"
path = "crates/component-manifest"

[workspace.dependencies.greentic-component-store]
version = ">=1.2.0-dev, <1.3.0-0"
path = "crates/greentic-component-store"

[workspace.dependencies.greentic-interfaces-guest]
version = ">=1.2.0-dev.37221142016, <1.3.0-0"
default-features = false
features = [
    "component-v0-6",
]

[workspace.dependencies.greentic-interfaces]
version = ">=1.2.0-dev.37221142016, <1.3.0-0"
default-features = false
features = [
    "bindings-rust",
    "common-types-v0-1",
    "component-v1",
    "component-v0-6",
    "describe-v1",
    "provision-v0-1",
    "wasix-mcp-v0-0-5",
    "wasix-mcp-24-11-05",
    "wasix-mcp-25-03-26",
    "wasix-mcp-25-06-18",
    "secrets-store-v1",
    "state-store-v1",
    "source-v1",
    "build-v1",
    "scan-v1",
    "signing-v1",
    "attestation-v1",
    "policy-v1",
    "metadata-v1",
    "distributor-api",
    "distributor-api-v1-1",
    "distribution-v1",
    "oci-v1",
    "http-client-v1",
    "http-client-v1-1",
    "telemetry-logger-v1",
    "repo-ui-actions-v1",
    "worker-api",
    "provider-common",
    "provider-core-v1",
    "oauth-broker-v1",
    "gui-fragment",
    "runner-host-v1",
]

[workspace.dependencies.greentic-distributor-client]
version = ">=1.2.0-dev, <1.3.0-0"
default-features = false
features = [
    "dist-client",
]

[workspace.dependencies.include_dir]
version = "0.7"

[workspace.dependencies.insta]
version = "1"
features = [
    "glob",
    "json",
]

[workspace.dependencies.miette]
version = "7"
default-features = false
features = [
    "derive",
]

[workspace.dependencies.oci-distribution]
version = "0.11"
default-features = false
features = [
    "rustls-tls",
]

[workspace.dependencies.reqwest]
version = "0.13"
default-features = false
features = [
    "json",
    "rustls",
    "blocking",
]

[workspace.dependencies.semver]
version = "1"
features = [
    "serde",
]

[workspace.dependencies.serde]
version = "1"
features = [
    "derive",
]

[workspace.dependencies.time]
version = "0.3"
features = [
    "serde",
    "formatting",
    "parsing",
]

[workspace.dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "fs",
    "time",
    "io-util",
]

[workspace.dependencies.uuid]
version = "1"
features = [
    "v4",
]

[workspace.dependencies.wasmtime]
# Keep this aligned with greentic-interfaces(-wasmtime). Mixing major Wasmtime
# versions makes generated host bindings and Linker/Store types incompatible.
version = "45"
default-features = false
features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
]

[workspace.dependencies.wasmtime-wasi]
version = "45"
