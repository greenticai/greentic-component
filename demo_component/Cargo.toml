[package]
name = "demo_component"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"
description = "Greentic component demo_component"

[package.metadata.greentic]
abi_version = "0.6.0"

[package.metadata.component]
package = "greentic:component"

[package.metadata.component.target]
world = "greentic:component/component-v0-v6-v0@0.6.0"

[lib]
crate-type = [
    "cdylib",
    "rlib",
]

[dependencies]
greentic-types = ">=1.2.0-dev, <1.3.0-0"
serde_json = "1"

[dependencies.greentic-interfaces-guest]
version = ">=1.2.0-dev, <1.3.0-0"
default-features = false
features = [
    "component-v0-6",
]

[dependencies.serde]
version = "1"
features = [
    "derive",
]
