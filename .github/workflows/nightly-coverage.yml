name: Nightly Coverage
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.95.0"

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  coverage-policy:
    name: coverage policy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WASM_RUSTFLAGS: "-C link-arg=-Wl,--no-keep-memory -C link-arg=-Wl,--threads=1 -C debuginfo=0"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: always
      CARGO_NET_RETRY: 5
      CARGO_HTTP_TIMEOUT: 120
      TARGET_DIR: target/linux
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          cache-key: ${{ runner.os }}-cargo-nightly-coverage-${{ hashFiles('Cargo.lock') }}
          target-dir: ${{ env.TARGET_DIR }}
          toolchain: ${{ env.RUST_VERSION }}
          targets: |
            wasm32-wasip2
            x86_64-unknown-linux-gnu
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install greentic-dev and cargo-component
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.cargo/bin:$PATH"
          cargo binstall --no-confirm greentic-dev cargo-component
          greentic-dev --version
          cargo-component --version
      - name: Validate coverage policy
        run: |
          export PATH="$GITHUB_WORKSPACE/.cargo/bin:$PATH"
          greentic-dev coverage
