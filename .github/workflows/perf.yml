name: Perf
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.95.0"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  perf:
    name: lightweight perf
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WASM_RUSTFLAGS: "-C link-arg=-Wl,--no-keep-memory -C link-arg=-Wl,--threads=1 -C debuginfo=0"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: always
      CARGO_NET_RETRY: 5
      CARGO_HTTP_TIMEOUT: 120
      TARGET_DIR: target/linux
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          cache-key: ${{ runner.os }}-cargo-perf-${{ hashFiles('Cargo.lock') }}
          target-dir: ${{ env.TARGET_DIR }}
          toolchain: ${{ env.RUST_VERSION }}
          targets: |
            wasm32-wasip2
            x86_64-unknown-linux-gnu
      - name: Run lightweight perf guards
        run: cargo test -p greentic-component --no-default-features --features cli --test perf_scaling --test perf_timeout --locked
      - name: Run criterion smoke benchmark
        run: cargo bench -p greentic-component --no-default-features --features cli --bench perf --locked -- --sample-size 10
