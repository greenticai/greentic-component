name: Nightly Semver Advisory

# Advisory-mode cargo-semver-checks moved off pull_request (was part of ci.yml
# as an inline job) onto a nightly schedule. See plans/binary-bifurcation.md
# Phase A. The real semver gate remains at weekly-stable-prepare on the main
# branch; this is the compass, not the gate.
#
# Package filter preserved from the inline job: scoped to the four published
# crates in this workspace (greentic-component, -manifest, -store, -runtime),
# which keeps cargo-semver-checks from failing on unpublished workspace
# members (demo_component, templates, etc.).

on:
  schedule:
    # 05:23 UTC — staggered to avoid 00/05/15/30/45 hot-spots and the
    # 05:17 slot used by greentic-types' nightly-semver.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      baseline-rev:
        description: "Optional explicit baseline git ref (default: latest vX.Y.Z tag)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-semver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  advisory:
    uses: greenticai/.github/.github/workflows/nightly-semver-advisory.yml@main
    with:
      semver-checks-package: "greentic-component,greentic-component-manifest,greentic-component-store,greentic-component-runtime"
      semver-baseline-rev: ${{ inputs.baseline-rev || '' }}
