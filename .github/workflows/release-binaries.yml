name: Release Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag'
    name: build-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            format: tgz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            format: tgz
          - runner: macos-15
            target: aarch64-apple-darwin
            format: tgz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            format: tgz
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            format: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            format: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-binaries-${{ matrix.target }}

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$version" = "$manifest_version"

      - name: Build every published binary
        shell: bash
        run: |
          cargo build --release --locked \
            --target "${{ matrix.target }}" \
            --package greentic-component \
            --bins

      - name: Package cargo-binstall archive
        shell: bash
        run: |
          bash ci/package_release_binaries.sh \
            "${{ matrix.target }}" \
            "${GITHUB_REF_NAME#v}" \
            "${{ matrix.format }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ matrix.target }}
          # Archives and checksums only. `dist/*` also matched the packaging
          # script's STAGING DIRECTORY (dist/<stem>/), which then reappeared in
          # .dist-staging/ and made `gh release upload` fail with
          # "read ...: is a directory" — on the very first entry, alphabetically
          # ahead of its own .tgz, so the release got its checksums and none of
          # its archives. That is how v1.1.4 published to crates.io with an
          # empty release, and v1.1.3's attach job failed the same way.
          path: |
            dist/*.tgz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  attach:
    name: Attach binaries to GitHub Release
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-binaries-*
          merge-multiple: true
          path: .dist-staging

      - name: Ensure release exists and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          # Pass regular files explicitly. The path filter above is the fix;
          # this is the belt: one directory reaching this glob again would
          # abort the whole upload partway, leaving a half-attached release
          # that still looks published.
          mapfile -t assets < <(find .dist-staging -maxdepth 1 -type f | sort)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no release assets staged" >&2
            exit 1
          fi
          printf 'uploading %d assets:\n' "${#assets[@]}"
          printf '  %s\n' "${assets[@]}"
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
