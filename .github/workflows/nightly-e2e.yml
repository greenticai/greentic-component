name: Nightly E2E
permissions:
  contents: read

concurrency:
  group: nightly-e2e
  cancel-in-progress: true

env:
  RUST_VERSION: "1.91.0"

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  wizard-e2e:
    name: wizard e2e
    runs-on: ubuntu-latest
    env:
      WASM_RUSTFLAGS: "-C link-arg=-Wl,--no-keep-memory -C link-arg=-Wl,--threads=1 -C debuginfo=0"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: always
      CARGO_NET_RETRY: 5
      CARGO_HTTP_TIMEOUT: 120
      TARGET_DIR: target/linux
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          cache-key: ${{ runner.os }}-cargo-nightly-e2e-${{ hashFiles('Cargo.lock') }}
          target-dir: ${{ env.TARGET_DIR }}
          toolchain: ${{ env.RUST_VERSION }}
          targets: |
            wasm32-wasip2
            x86_64-unknown-linux-gnu
      - name: Run ignored wizard e2e replay/build test
        run: |
          cargo test -p greentic-component \
            --test wizard_tests \
            wizard_emit_answers_round_trips_all_fields_and_replay_builds_component \
            -- --ignored --nocapture
