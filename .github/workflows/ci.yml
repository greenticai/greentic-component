name: CI
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    uses: greenticai/.github/.github/workflows/pr-ci.yml@main
    with:
      variant: host
      toolchain-variant: wasm

  wit-guard:
    name: wit-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical WIT duplication guard
        run: bash ci/check_no_duplicate_canonical_wit.sh .
      - name: Canonical bindings import guard
        run: bash ci/check_no_bindings_imports.sh .

  release:
    name: release smoke + package
    needs: [ci, wit-guard]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-release
      cancel-in-progress: true
    env:
      RUST_VERSION: "1.95.0"
      WASM_RUSTFLAGS: "-C link-arg=-Wl,--no-keep-memory -C link-arg=-Wl,--threads=1 -C debuginfo=0"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: always
      CARGO_NET_RETRY: 5
      CARGO_HTTP_TIMEOUT: 120
      TARGET_DIR: target/linux
      PUBLISH_CRATES: "greentic-component-manifest greentic-component-store greentic-component-runtime greentic-component"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust environment
        uses: ./.github/actions/rust-setup
        with:
          cache-key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          target-dir: ${{ env.TARGET_DIR }}
          toolchain: ${{ env.RUST_VERSION }}
          targets: |
            wasm32-wasip2
            x86_64-unknown-linux-gnu
      - name: Check canonical WIT duplication guard
        run: bash ci/check_no_duplicate_canonical_wit.sh .
      - name: Run release checks
        run: |
          LOCAL_CHECK_ONLINE=1 \
          LOCAL_CHECK_STRICT=1 \
          LOCAL_CHECK_VERBOSE=1 \
          LOCAL_CHECK_SKIP_FMT=1 \
          LOCAL_CHECK_SKIP_CLIPPY=1 \
          LOCAL_CHECK_SKIP_BUILD=1 \
          LOCAL_CHECK_SKIP_TEST=1 \
          LOCAL_CHECK_SKIP_BUILD_ALL=1 \
          LOCAL_CHECK_SKIP_TEST_ALL=1 \
          LOCAL_CHECK_SKIP_SCHEMA=1 \
          LOCAL_CHECK_PUBLISH_MODE=dry-run \
          LOCAL_VERSION_UPGRADE=1 \
          bash ci/local_check.sh
      - name: Verify cargo-binstall archive layout
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          RELEASE_BIN_DIR="$TARGET_DIR/release" \
            bash ci/package_release_binaries.sh x86_64-unknown-linux-gnu "$version" tgz
          archive="dist/greentic-component-v${version}-x86_64-unknown-linux-gnu.tgz"
          archive_listing="$(tar -tzf "$archive")"
          for bin in greentic-component component-doctor component-hash component-inspect; do
            grep -Fxq \
              "greentic-component-v${version}-x86_64-unknown-linux-gnu/${bin}" \
              <<< "$archive_listing"
          done
