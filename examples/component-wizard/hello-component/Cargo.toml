[package]
name = "hello-component"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"
description = "Greentic component hello-component"

[package.metadata.greentic]
abi_version = "0.6.0"

[lib]
crate-type = [
    "cdylib",
    "rlib",
]

[dependencies]
greentic-types = ">=0.6.0-dev, <0.7.0-0"
serde_json = "1"

[dependencies.greentic-interfaces-guest]
version = ">=0.6.0-dev, <0.7.0-0"
default-features = false
features = [
    "component-v0-6",
]

[dependencies.serde]
version = "1"
features = [
    "derive",
]
